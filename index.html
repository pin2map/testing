  pins:[{id:'p1',name:'Alter Wasserturm',note:'',created:'7.11.2026, 22:55:57',category:'Orte',lat:48.7812,lon:9.1833,weather:false},{id:'p2',name:'Bahnhof',note:'',created:'7.11.2026, 20:20:04',category:'Orte',lat:48.7843,lon:9.1779,weather:false}],
  areas:[{id:'a1',name:'Stadtpark',note:'',category:'Natur',created:'7.11.2026, 18:02:10'}],
  routing:{start:null,waypoints:[],target:null}
 });
 let state=initial();const listeners=new Set();
 const publish=()=>listeners.forEach(fn=>fn(state));
 return {get:()=>state,subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn)},
  update(fn){fn(state);publish()}, reset(){state=initial();publish()},
  pin(id){return state.pins.find(p=>p.id===id)},area(id){return state.areas.find(a=>a.id===id)},
  createPin(name){const id='p'+(Date.now());state.pins.push({id,name:name||'Neuer Pin',note:'',created:new Date().toLocaleString('de-DE'),category:'Orte',lat:48.78,lon:9.18,weather:false});publish();return id},
  createArea(name){const id='a'+Date.now();state.areas.push({id,name:name||'Neue Fläche',note:'',category:'Natur',created:new Date().toLocaleString('de-DE')});publish();return id},
  removePin(id){state.pins=state.pins.filter(p=>p.id!==id);publish()},removeArea(id){state.areas=state.areas.filter(a=>a.id!==id);publish()},
  snapshot(){return JSON.stringify({kind:'pin2map-ui-prototype',version:1,state},null,2)},
  loadSnapshot(json){const data=JSON.parse(json);if(data.kind!=='pin2map-ui-prototype'||!data.state)throw Error('Keine PoC-Projektdatei');state=data.state;publish()}
 };
})();

</script><script>
/* Ausschließlich Oberflächensteuerung. Keine Netzwerke, Synchronisation oder fachlichen Services. */
(() => {
 const model=window.Pin2MapModel;
 const $=id=>document.getElementById(id);
 const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let active=null,mode='pin',pendingMapPoint=null,toastTimer,meteoShown=false;
 const say=t=>{const x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('show'),2400)};
 const close=()=>{$('overlay').classList.add('hidden');$('sheet').classList.add('hidden');active=null;pendingMapPoint=null};
 const btn=(name,action,cls='',title='')=>`<button type="button" class="round-action ${cls}" data-dialog-action="${action}" title="${escape(title||name)}" aria-label="${escape(title||name)}">${name}</button>`;
 const pin=model.pin,area=model.area;
 function renderMap(){const s=model.get();$('projectLabel').textContent=s.project;$('map').dataset.style=s.mapStyle;$('mapBackground').style.transform=`scale(${s.zoom}) translate(${s.focusX}px,${s.focusY}px)`;$('pinMapLabel').textContent=s.topLabel==='Name'?'Alter Wasserturm':s.topLabel==='Höhe'?'342 m':s.topLabel==='Temperatur'?'18 °C':s.topLabel==='Koordinaten'?'48.7812, 9.1833':'Alter Wasserturm';$('pinMarker').style.display=s.filter.pins&&s.selectedCategory!=='Natur'&&(!s.filter.onlyNotes||!!s.pins[0]?.note)&&(!s.filter.query||s.pins[0]?.name.toLowerCase().includes(s.filter.query.toLowerCase()))?'':'none';$('pinMarkerSecond').style.display=s.filter.pins&&s.selectedCategory!=='Natur'&&!s.filter.onlyNotes&&(!s.filter.query||s.pins[1]?.name.toLowerCase().includes(s.filter.query.toLowerCase()))?'':'none';$('areaLayer').style.display=s.filter.areas&&s.selectedCategory!=='Orte'&&(!s.filter.query||s.areas[0]?.name.toLowerCase().includes(s.filter.query.toLowerCase()))?'':'none';document.querySelectorAll('.pin-label').forEach(x=>x.style.display=s.labelsVisible?'':'none');$('areaLabel').style.display=s.labelsVisible?'':'none';}
 model.subscribe(renderMap);
 function openPopup(kind,id){close();active={kind,id};const obj=kind==='pin'?pin(id):area(id);if(!obj){say('Demo-Objekt nicht vorhanden');return;} $('popup').innerHTML=kind==='pin'?pinDialog(obj):areaDialog(obj);$('overlay').classList.remove('hidden');}
 function pinDialog(p){const route=model.get().routing;return `<button class="close-popup" data-dialog-action="close" title="Schließen" aria-label="Schließen">×</button>
  <fieldset class="form-field name-field"><legend>Pin Name</legend><input id="pinName" value="${escape(p.name)}" aria-label="Pin Name"></fieldset>
  <div class="created-at">Erstellt: ${escape(p.created)}</div>
  <div class="action-groups"><fieldset class="form-field"><legend>Navi extern</legend>${btn('+','navExternal','blue','Externe Navigation')}${btn('','apple','', 'Apple Karten')}</fieldset><fieldset class="form-field route-field"><legend>pin2map Routing</legend>${btn('↗','routeStart','redring '+(route.start===p.id?'active-red':''),'Startpunkt')}${btn('+','routeWaypoint','yellowring '+(route.waypoints.includes(p.id)?'active-yellow':''),'Zwischenziel')}${btn('◎','routeTarget','greenring '+(route.target===p.id?'active-green':''),'Zielpunkt')}</fieldset></div>
  <fieldset class="form-field note-field"><legend>Pin Notizen</legend><textarea id="pinNote" placeholder="Notiz eingeben …">${escape(p.note)}</textarea></fieldset>
  ${meteoShown?`<section class="meteo"><h3>Wetter · UI-Entwurf</h3><div class="meteo-row"><span>⛅</span><strong>18 °C</strong><span>Leicht bewölkt</span><span>💨 9 km/h</span></div><p class="subtle">Beispieldaten, keine Wetterabfrage. Darstellung wird gemeinsam optimiert.</p></section>`:''}
  <div class="bottom-actions">${btn('×','delete','delete','Pin entfernen')}${btn('URL','url','smalltext','URL / Link')}${btn('📍','pinCategory','','Pin-Symbol / Kategorie')}${btn('✓','confirm','confirm','Eingaben übernehmen')}${btn('ⓦ','wiki','','Wikipedia')}${btn('🌤️','weather','','Wetterdarstellung')}</div>`}
 function areaDialog(a){return `<button class="close-popup" data-dialog-action="close" title="Schließen" aria-label="Schließen">×</button>
 <fieldset class="form-field name-field"><legend>Flächenname</legend><input id="areaName" value="${escape(a.name)}" aria-label="Flächenname"></fieldset><div class="created-at">Erstellt: ${escape(a.created)}</div><div class="fake-area">▱ &nbsp; Flächenobjekt · Kategorie ${escape(a.category)}</div>
 <fieldset class="form-field note-field" style="margin-top:20px"><legend>Flächen-Notizen · PoC-Vorschlag</legend><textarea id="areaNote" placeholder="Notiz eingeben …">${escape(a.note||'')}</textarea></fieldset><div class="bottom-actions">${btn('×','delete','delete','Fläche entfernen')}${btn('▦','areaCategory','','Flächenkategorie')}${btn('✓','confirm','confirm','Übernehmen')}${btn('ⓦ','wiki','','Wikipedia')}</div><p class="sheet-note">Der Flächendialog verwendet denselben Stil wie der Pin-Dialog. Die genaue Funktionsausstattung wird erst nach der UI-Abnahme festgelegt.</p>`}
 function openSheet(title,html){$('sheetTitle').textContent=title;$('sheetContent').innerHTML=html;$('sheet').classList.remove('hidden')}
 function choices(items,callback){return `<div class="choices">${items.map(([symbol,name,desc],i)=>`<button class="choice" data-choice="${i}"><span class="mark">${symbol}</span><span><strong>${escape(name)}</strong>${desc?`<small>${escape(desc)}</small>`:''}</span></button>`).join('')}</div>`}
 function menuTypes(){const types=[['📍','Pin','Ort oder Name suchen'],['▱','Fläche','Geografische Flächen'],['💧','See','Wasserflächen'],['〰','Fluss','Flüsse und Bäche'],['☷','Filter','Vorhandene Objekte filtern']];openSheet('Suchart auswählen',choices(types));$('sheetContent').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.choice);mode=['pin','area','lake','river','filter'][i];closeSheet();if(i===4){openFilter();return}const q=$('searchInput').value.trim();if(q)search(q,mode);else say('Suchbegriff eingeben und Suchart wählen')})}
 function closeSheet(){$('sheet').classList.add('hidden')}
 function search(q,kind='pin'){if(!q){say('Bitte Suchbegriff eingeben');return}const results=kind==='pin'?[['📍','Neustadt','Stadt · Baden-Württemberg, Deutschland'],['●','Neustadt','Ortsmittelpunkt · Sachsen, Deutschland'],['▱','Neustadt','Verwaltungsgebiet · Rheinland-Pfalz, Deutschland']]:kind==='area'?[['🌳',q+' – Stadtpark','Park / Grünfläche'],['▱',q+' – Landkreis','Verwaltungsgebiet']]:kind==='lake'?[['💧',q+' – See','See / Wasserfläche'],['▱',q+' – Uferzone','Fläche']]:[['〰',q+' – Fluss','Gewässer / Verlauf'],['〰',q+' – Bach','Bach / Verlauf']];openSheet(kind==='pin'?'Ort auswählen':'Suchtreffer auswählen',`<div class="stack">${results.map((r,i)=>`<div class="result-item" data-result="${i}" role="button" tabindex="0"><div class="result-name"><strong>${escape(q==='Neustadt'?r[1]:(i===0?q:r[1]))}</strong><span class="result-type">${r[0]} ${escape(r[2].split(' · ')[0])}</span></div><div class="result-detail">${escape(r[2])}</div></div>`).join('')}</div><p class="sheet-note">Die Treffer sind ausschließlich im Auswahldialog sichtbar und verändern den Autozoom nicht.</p><div class="actions-row"><button class="secondary" id="cancelSearch">Abbrechen</button></div>`);$('cancelSearch').onclick=closeSheet;$('sheetContent').querySelectorAll('[data-result]').forEach(el=>el.onclick=()=>{const label=q==='Neustadt'?results[Number(el.dataset.result)][1]:q;closeSheet();$('searchInput').value='';if(kind==='pin'){const id=model.createPin(label);showNewPin(id)}else if(kind==='area'||kind==='lake'){const id=model.createArea(label);openPopup('area',id);say('Fläche als Demo angelegt')}else{say('Fluss-Vorschau ausgewählt · Umsetzung folgt')}})}
 function showNewPin(id){const p=pin(id);model.update(s=>{s.zoom=1.08});openPopup('pin',id);say(`„${p.name}“ als Demo-Pin angelegt`)}
 function openFilter(){const s=model.get();openSheet('Objekte filtern · Neugestaltung',`<div class="stack"><label>Nach Name suchen<input id="filterText" type="search" value="${escape(s.filter.query)}" placeholder="Filtertext …"></label><div class="switch-row"><span>Pins anzeigen</span><input type="checkbox" id="fPins" ${s.filter.pins?'checked':''}></div><div class="switch-row"><span>Flächen anzeigen</span><input type="checkbox" id="fAreas" ${s.filter.areas?'checked':''}></div><div class="switch-row"><span>Nur Pins mit Notizen</span><input type="checkbox" id="fNotes" ${s.filter.onlyNotes?'checked':''}></div><div class="actions-row"><button class="primary" id="applyFilter">Anwenden</button><button class="secondary" id="clearFilter">Zurücksetzen</button></div></div><p class="sheet-note">Die Bedienung des Filters wird ausdrücklich neu gestaltet. Dies ist ein erster Layoutvorschlag, kein finaler Funktionsbeschluss.</p>`);$('applyFilter').onclick=()=>{model.update(s=>{s.filter.query=$('filterText').value;s.filter.pins=$('fPins').checked;s.filter.areas=$('fAreas').checked;s.filter.onlyNotes=$('fNotes').checked});closeSheet();say('Demo-Filter angewendet')};$('clearFilter').onclick=()=>{model.update(s=>s.filter={pins:true,areas:true,onlyNotes:false,query:''});closeSheet();say('Filter zurückgesetzt')}}
 function openCategories(){const s=model.get();openSheet('Kategorien · Neugestaltung',`<p class="subtle">Kategorien sichtbar schalten und gezielt auswählen.</p>${choices([['🌍','Alle Kategorien','Alle sichtbaren Objekte'],...s.categories.map(c=>[c.symbol,c.name,'Kategorie auswählen'])])}<p class="sheet-note">Die bisherige Kategorien-Auswahl wird neu gestaltet, ohne das Kategorienmodell vorwegzunehmen.</p>`);$('sheetContent').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.choice);model.update(s=>s.selectedCategory=i===0?'Alle':s.categories[i-1].name);closeSheet();say(i===0?'Alle Kategorien':'Kategorie: '+model.get().selectedCategory)})}
 function openTopLabels(){const modes=[['ⓘ','Keine','Standarddarstellung'],['🏷','Name','Objektname oberhalb des Pins'],['⛰','Höhe','Höhenangabe'],['🌡','Temperatur','Temperatur am Standort (Simulation)'],['⌖','Koordinaten','Koordinaten (Simulation)']];openSheet('Obere Pin-Informationen · Neugestaltung',choices(modes));$('sheetContent').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.choice);model.update(s=>s.topLabel=modes[i][1]);closeSheet();say('Oberes Label: '+modes[i][1])})}
 function openStyles(){const styles=[['🗺️','International','helle Kartenansicht'],['🧭','OSM Original','stärkere Farben'],['⛰️','Topografisch','Geländeorientiert'],['🌑','Dunkel','dunkle Simulation']];openSheet('Kartenart wählen',choices(styles));$('sheetContent').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{model.update(s=>s.mapStyle=styles[Number(b.dataset.choice)][1]);closeSheet();say('Kartenart: '+model.get().mapStyle)})}
 function openConfig(){openSheet('Konfiguration · UI-PoC',`<div class="stack"><label>Projektname<input id="projectName" type="text" value="${escape(model.get().project)}"></label><div class="switch-row"><span>Pin-/Flächenbeschriftungen anzeigen</span><input id="cfgLabels" type="checkbox" ${model.get().labelsVisible?'checked':''}></div><div class="actions-row"><button id="cfgApply" class="primary">Übernehmen</button></div></div><p class="sheet-note">Hier wird später zwischen Konfigurationsoberfläche und gespeicherten Projekteinstellungen unterschieden.</p>`);$('cfgApply').onclick=()=>{model.update(s=>{s.project=$('projectName').value||'Mein Kartenprojekt';s.labelsVisible=$('cfgLabels').checked});closeSheet();say('Konfiguration als Demo übernommen')}}
 function confirmReset(){openSheet('Projekt zurücksetzen?',`<p>Dies setzt nur die <strong>Demo-Oberfläche</strong> zurück. Es existieren keine echten Projektdaten.</p><div class="actions-row"><button id="doReset" class="primary danger">Demo zurücksetzen</button><button id="cancelReset" class="secondary">Abbrechen</button></div>`);$('doReset').onclick=()=>{model.reset();closeSheet();say('Demo-Oberfläche zurückgesetzt')};$('cancelReset').onclick=closeSheet}
 function downloadSnapshot(){const blob=new Blob([model.snapshot()],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pin2map-ui-poc.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);say('Demo-Projektdatei gespeichert (keine echte pin2map-Datei)')}
 function openLocal(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const f=input.files?.[0];if(!f)return;f.text().then(t=>{model.loadSnapshot(t);close();say('Demo-Projekt geladen')}).catch(()=>say('Keine gültige PoC-Datei'))};input.click()}
 function popupAction(a){const obj=active&&(active.kind==='pin'?pin(active.id):area(active.id));if(a==='close'){close();return}if(!obj)return;if(a==='confirm'){const n=$(active.kind==='pin'?'pinName':'areaName');const note=$(active.kind==='pin'?'pinNote':'areaNote');model.update(()=>{obj.name=n?.value||obj.name;obj.note=note?.value||''});close();say('Änderungen im Demo-Modell übernommen');return}if(a==='delete'){openSheet('Objekt aus Demo entfernen?',`<p><strong>${escape(obj.name)}</strong> entfernen?</p><div class="actions-row"><button class="primary danger" id="reallyDelete">Entfernen</button><button class="secondary" id="abortDelete">Abbrechen</button></div>`);$('reallyDelete').onclick=()=>{active.kind==='pin'?model.removePin(active.id):model.removeArea(active.id);close();say('Demo-Objekt entfernt')};$('abortDelete').onclick=closeSheet;return}if(a==='weather'){meteoShown=!meteoShown;openPopup('pin',obj.id);return}if(a==='pinCategory'||a==='areaCategory'){openSheet('Objektkategorie wählen · Neugestaltung',choices(model.get().categories.map(c=>[c.symbol,c.name,'Kategorie / Symbol'])));$('sheetContent').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const category=model.get().categories[Number(b.dataset.choice)].name;model.update(()=>obj.category=category);closeSheet();say('Kategorie: '+category)});return}if(a.startsWith('route')){model.update(s=>{if(a==='routeStart')s.routing.start=obj.id;else if(a==='routeTarget')s.routing.target=obj.id;else if(a==='routeWaypoint'){const i=s.routing.waypoints.indexOf(obj.id);if(i===-1)s.routing.waypoints.push(obj.id);else s.routing.waypoints.splice(i,1)}});openPopup('pin',obj.id);say('Demo-Routingstatus geändert');return}if(a==='url'){openSheet('URL / Link',`<label class="stack">Link zum Pin<input type="text" value="https://example.invalid/pin/${escape(obj.id)}" readonly></label><p class="sheet-note">Nur UI-Platzhalter. Kein Teilen oder Backend.</p>`);return}if(a==='navExternal'||a==='apple'){openSheet('Navigation extern',choices([['↗','Google Maps','Externer Navigationsdienst'],['','Apple Karten','Externer Navigationsdienst']]));$('sheetContent').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{closeSheet();say('Externe Navigation nur simuliert')});return}if(a==='wiki'){openSheet('Externe Informationen',choices([['ⓦ','Wikipedia','Externe Informationen'],['⌖','OpenHistoricalMap','Historische Karteninformationen']]));$('sheetContent').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{closeSheet();say('Externe Quelle nur simuliert')});return}}
 $('pinMarker').addEventListener('click',()=>openPopup('pin','p1'));$('pinMarkerSecond').addEventListener('click',()=>openPopup('pin','p2'));$('areaLayer').addEventListener('click',()=>openPopup('area','a1'));
 ['pinMarker','pinMarkerSecond','areaLayer'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$(id).click()}}));
 document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='mapStyles')openStyles();if(a==='categories')openCategories();if(a==='topLabels')openTopLabels();if(a==='labelVisibility'){model.update(s=>s.labelsVisible=!s.labelsVisible);say(model.get().labelsVisible?'Labels eingeblendet':'Labels ausgeblendet')}if(a==='config')openConfig();if(a==='reset')confirmReset();if(a==='openFile')openLocal();if(a==='saveFile')downloadSnapshot()}));
 $('filterBtn').onclick=openFilter;$('typeBtn').onclick=menuTypes;$('clearSearch').onclick=()=>{$('searchInput').value='';$('searchInput').focus()};$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search($('searchInput').value.trim(),'pin')}});
 $('overlay').addEventListener('click',e=>{const b=e.target.closest('[data-dialog-action]');if(b){popupAction(b.dataset.dialogAction);return}if(e.target.dataset.dismiss)close()});$('popup').addEventListener('input',e=>{if(!active)return;if(e.target.id==='pinNote'||e.target.id==='areaNote'){const o=active.kind==='pin'?pin(active.id):area(active.id);if(o)o.note=e.target.value}});
 $('sheetClose').onclick=closeSheet;$('sheet').addEventListener('click',e=>{if(e.target.dataset.dismiss)closeSheet()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('sheet').classList.contains('hidden'))closeSheet();else close()}});
 $('zoomIn').onclick=()=>model.update(s=>s.zoom=Math.min(1.8,s.zoom+.12));$('zoomOut').onclick=()=>model.update(s=>s.zoom=Math.max(.75,s.zoom-.12));$('autoZoom').onclick=()=>{model.update(s=>{s.zoom=1;s.focusX=0;s.focusY=0});say('Autozoom · Demo-Kartenausschnitt')};
 $('map').addEventListener('contextmenu',e=>{if(e.target.closest('.pin-marker,.map-object-area'))return;e.preventDefault();pendingMapPoint={x:e.clientX,y:e.clientY};openSheet('Aktion wählen',choices([['📍','Pin setzen','An dieser Kartenposition'],['▱','Gebiete suchen','Geografische Fläche an dieser Position'],['×','Abbrechen','Keine Änderung']]));$('sheetContent').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.choice);closeSheet();if(i===0){let id=model.createPin('Neuer Pin');openPopup('pin',id)}else if(i===1){let id=model.createArea('Neue Fläche');openPopup('area',id)}else say('Abgebrochen')})});
 let hold=null,x0=0,y0=0;const map=$('map');map.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('.pin-marker,.map-object-area'))return;x0=e.touches[0].clientX;y0=e.touches[0].clientY;clearTimeout(hold);hold=setTimeout(()=>{const evt=new MouseEvent('contextmenu',{bubbles:true,cancelable:true,clientX:x0,clientY:y0});map.dispatchEvent(evt)},680)},{passive:true});map.addEventListener('touchmove',e=>{if(hold&&e.touches.length&&(Math.abs(e.touches[0].clientX-x0)>12||Math.abs(e.touches[0].clientY-y0)>12))clearTimeout(hold)},{passive:true});map.addEventListener('touchend',()=>clearTimeout(hold));
 renderMap();
})();
